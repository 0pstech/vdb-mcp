[build-system]
# <1.32: 1.32 emits Metadata-Version 2.5, which twine (via packaging) does not
# accept yet — `twine check` fails with "'2.5' is not a valid metadata version".
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "vdb-mcp"
version = "0.2.5"
description = "MCP server for VDB — AI-aware vulnerability database (packages, MCP servers, models). Check packages for CVEs and slopsquatting before installing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
authors = [{ name = "VDB", email = "dev@egdee.com" }]
keywords = [
    "mcp", "model-context-protocol", "security", "vulnerability",
    "sbom", "slopsquatting", "supply-chain", "cve", "osv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    # `mcp` pulls starlette/uvicorn needed by the optional SSE mode.
    #
    # PINNED BELOW 2 ON PURPOSE. The SDK's 2.0 release removed the
    # decorator-based low-level API this server is written against
    # (`@server.list_tools()` / `@server.call_tool()`) in favour of a new
    # MCPServer class. With an open `>=1.0.0` range, a fresh `uvx vdb-mcp`
    # resolved mcp 2.x and died at import with AttributeError before serving
    # a single request — silently, since the client just sees a server that
    # won't start. Migrating to the 2.x API is its own piece of work; until
    # then this bound is what keeps the published package usable.
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://vdb.ai.kr"
Documentation = "https://vdb.ai.kr/connect"
Repository = "https://github.com/0pstech/vdb-mcp"

[project.scripts]
vdb-mcp = "vdb_mcp.server:main"
# `vdb harden ...` is what every document says to type. It has to come from
# somewhere installable, and this is the package people already install.
vdb = "vdb_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vdb_mcp"]
